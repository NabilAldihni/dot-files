# Set vim like pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

set-option -g history-limit 100000

# don't rename windows automatically
set-option -g allow-rename off

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.config/tmux/tmux.conf

# Copy to clipboard
set -s copy-command 'xsel -bi'

# Set copy mode to vi
setw -g mode-keys vi

# Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Copy without leaving copy mode or clearing the selection.
# Must be set before TPM; tmux-yank reads these when it binds keys.
set -g @yank_with_mouse on
set -g @yank_action 'copy-pipe'

# Initialize TPM (plugins are committed in dot-files, no auto-install needed)
run '~/.config/tmux/plugins/tpm/tpm'

# Enter and mouse clicks are still copy-pipe-and-cancel (tmux default, then
# wrapped by tmux-copycat). Rebind them so they copy and stay put.
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-no-clear
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-no-clear
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-no-clear

# Set default directory for new windows in this session to current directory
bind l attach-session -c "#{pane_current_path}"

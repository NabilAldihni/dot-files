general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    # Hyprland 0.56 parses dispatch args as Lua. `dpms on` is a syntax error, so the
    # screen never actually woke and hyprlock couldn't draw the password until a
    # keypress finished the modeset.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 600
    on-timeout = brightnessctl -s set 40%         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 900                                 # 15min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 1020
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && brightnessctl -r
}

listener {
    timeout = 1800                                 # 30min total idle — suspend
    on-timeout = systemctl suspend
}
